[project]
name = "calchas"
version = "0.1.0"
description = "Calchas: black-box injection vulnerability detection for MCP servers"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "rich>=13",
    "langgraph>=1",
    "langchain-mcp-adapters>=0.3",
    "langchain-openai>=1",
]

[project.scripts]
calchas = "calchas.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["calchas*"]
